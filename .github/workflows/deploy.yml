name: deploy

# Deploys tensorsketch.space to Vercel (production) on every push to main.
# You can also trigger it by hand from the Actions tab (workflow_dispatch).
#
# Requires three repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        a Vercel access token   (https://vercel.com/account/tokens)
#   VERCEL_ORG_ID       your Vercel team/org id \ both are written into .vercel/project.json
#   VERCEL_PROJECT_ID   this project's id       / when you run `vercel link` once, locally
#
# The Vercel project must exist first (run `vercel link` in this repo, or import it once in the
# Vercel dashboard) — that's what gives you the ORG and PROJECT ids.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two production deploys at once; newer pushes win.
concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      # A token deploy shouldn't be gated on who authored the commit. On the Hobby plan Vercel
      # blocks a deploy whose commit author can't be matched to a GitHub account on the team.
      # Removing .git isn't enough on its own: inside GitHub Actions the Vercel CLI rebuilds the
      # git association from the GITHUB_* env vars (it resolves the author from GITHUB_SHA against
      # the linked repo). So we strip .git *and* blank those variables on the Vercel steps below —
      # leaving no commit for Vercel to gate on, so the token alone authorizes the deploy.
      - name: Strip git metadata (deploy by token only)
        run: rm -rf .git

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      # Blank the git association on each Vercel step so no commit author is attached (see note
      # above). Kept explicit per step rather than via a YAML anchor to avoid any parser surprises.
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_SHA: ""
          GITHUB_REF: ""
          GITHUB_REF_NAME: ""
          GITHUB_HEAD_REF: ""
          GITHUB_REPOSITORY: ""
          GITHUB_REPOSITORY_OWNER: ""
          GITHUB_ACTOR: ""
          GITHUB_EVENT_NAME: ""
          GITHUB_EVENT_PATH: ""

      # Bypass `vercel build` — it kept producing an empty static output for this plain
      # root-level static site (framework/output-dir detection). Instead we hand-assemble the
      # Build Output API v3 layout ourselves: copy the site files into .vercel/output/static and
      # write a config.json carrying cleanUrls / trailingSlash / the same headers as vercel.json.
      # This cannot ship an empty deploy because we place the files directly.
      - name: Assemble the prebuilt static output
        run: |
          set -euo pipefail
          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='.vercel' \
            --exclude='vercel.json' --exclude='README.md' --exclude='.gitignore' \
            ./ .vercel/output/static/
          printf '%s' '{"version":3,"cleanUrls":true,"trailingSlash":false,"routes":[{"src":"^/assets/(.*)$","headers":{"cache-control":"public, max-age=31536000, immutable"},"continue":true},{"src":"^/(.*)$","headers":{"x-content-type-options":"nosniff","referrer-policy":"strict-origin-when-cross-origin"},"continue":true}]}' > .vercel/output/config.json
          echo "--- static output (root) ---"; ls -la .vercel/output/static
          test -f .vercel/output/static/index.html
          test -f .vercel/output/static/docs/index.html

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_SHA: ""
          GITHUB_REF: ""
          GITHUB_REF_NAME: ""
          GITHUB_HEAD_REF: ""
          GITHUB_REPOSITORY: ""
          GITHUB_REPOSITORY_OWNER: ""
          GITHUB_ACTOR: ""
          GITHUB_EVENT_NAME: ""
          GITHUB_EVENT_PATH: ""
